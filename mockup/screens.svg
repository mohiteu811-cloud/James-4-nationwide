<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 760" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="780" height="760" fill="#f3f4f6"/>
  <text x="390" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">What the supporter sees — on their phone</text>

  <!-- ========================= PHONE 1: /pledge ========================= -->
  <g>
    <rect x="60" y="70" width="300" height="610" rx="28" fill="#ffffff" stroke="#111827" stroke-width="3"/>
    <rect x="60" y="70" width="300" height="40" rx="28" fill="#111827"/>
    <rect x="60" y="92" width="300" height="18" fill="#111827"/>
    <text x="210" y="96" text-anchor="middle" font-size="11" fill="#ffffff">james4nationwide.co.uk/pledge/?ref=K7M9P2Q</text>

    <text x="84" y="150" font-size="24" font-weight="700" fill="#111827">Pledge to vote.</text>

    <text x="84" y="178" font-size="12.5" fill="#374151">There's a real choice on this year's</text>
    <text x="84" y="196" font-size="12.5" fill="#374151">Nationwide ballot — but the form is</text>
    <text x="84" y="214" font-size="12.5" fill="#374151">built to hide it. Pledge now and we'll</text>
    <text x="84" y="232" font-size="12.5" fill="#374151">send you one reminder the day your</text>
    <text x="84" y="250" font-size="12.5" fill="#374151">ballot lands. No spam, just the nudge.</text>

    <!-- trigger box -->
    <rect x="84" y="268" width="252" height="62" rx="6" fill="#fff3cd"/>
    <rect x="84" y="268" width="6" height="62" fill="#b8860b"/>
    <text x="100" y="292" font-size="13" font-weight="700" fill="#7a5901">Don't Quick Vote.</text>
    <text x="100" y="310" font-size="13" font-weight="700" fill="#7a5901">Scroll down. Vote FOR</text>
    <text x="100" y="328" font-size="13" font-weight="700" fill="#7a5901">Sherwin-Smith.</text>

    <!-- form -->
    <rect x="84" y="352" width="252" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="98" y="379" font-size="13" fill="#9ca3af">your@email.com</text>

    <rect x="84" y="406" width="252" height="48" rx="6" fill="#0b6e4f"/>
    <text x="210" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Pledge to vote</text>

    <text x="84" y="478" font-size="10.5" fill="#6b7280">Double opt-in: you'll get one email to</text>
    <text x="84" y="492" font-size="10.5" fill="#6b7280">confirm. Unsubscribe any time.</text>

    <!-- hidden field callout -->
    <rect x="84" y="516" width="252" height="40" rx="6" fill="#eef2ff" stroke="#1d4ed8" stroke-dasharray="4 3"/>
    <text x="210" y="533" text-anchor="middle" font-size="10" fill="#1d4ed8">hidden: referred_by = K7M9P2Q</text>
    <text x="210" y="548" text-anchor="middle" font-size="9" fill="#1d4ed8">(captured from ?ref= in the URL)</text>

    <text x="210" y="710" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">1 · The /pledge page</text>
  </g>

  <!-- arrow between -->
  <g>
    <line x1="372" y1="400" x2="408" y2="400" stroke="#6b7280" stroke-width="3"/>
    <polygon points="408,393 422,400 408,407" fill="#6b7280"/>
    <text x="397" y="385" text-anchor="middle" font-size="10" fill="#6b7280">confirm</text>
  </g>

  <!-- ====================== PHONE 2: /thank-you ====================== -->
  <g>
    <rect x="420" y="70" width="300" height="610" rx="28" fill="#ffffff" stroke="#111827" stroke-width="3"/>
    <rect x="420" y="70" width="300" height="40" rx="28" fill="#111827"/>
    <rect x="420" y="92" width="300" height="18" fill="#111827"/>
    <text x="570" y="96" text-anchor="middle" font-size="11" fill="#ffffff">james4nationwide.co.uk/thank-you/</text>

    <text x="444" y="148" font-size="19" font-weight="700" fill="#111827">Thank you — you've</text>
    <text x="444" y="170" font-size="19" font-weight="700" fill="#111827">pledged to vote.</text>

    <text x="444" y="196" font-size="12" fill="#374151">Check your inbox for one confirmation</text>
    <text x="444" y="212" font-size="12" fill="#374151">email and click the link inside.</text>

    <!-- trigger box -->
    <rect x="444" y="226" width="252" height="40" rx="6" fill="#fff3cd"/>
    <rect x="444" y="226" width="6" height="40" fill="#b8860b"/>
    <text x="460" y="244" font-size="11.5" font-weight="700" fill="#7a5901">Don't Quick Vote. Scroll down.</text>
    <text x="460" y="259" font-size="11.5" font-weight="700" fill="#7a5901">Vote FOR Sherwin-Smith.</text>

    <!-- live count -->
    <rect x="444" y="280" width="252" height="40" rx="6" fill="#ecfdf5"/>
    <text x="570" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#0b6e4f">You've brought in 3 voters.</text>

    <text x="444" y="344" font-size="13" font-weight="700" fill="#111827">Now multiply your vote.</text>
    <text x="444" y="362" font-size="11.5" fill="#374151">Share your personal link — every</text>
    <text x="444" y="378" font-size="11.5" fill="#374151">member who pledges through it counts.</text>

    <!-- link box + copy -->
    <rect x="444" y="392" width="178" height="42" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="456" y="418" font-size="10" fill="#111827">.../pledge/?ref=K7M9P2Q</text>
    <rect x="630" y="392" width="66" height="42" rx="6" fill="#0b6e4f"/>
    <text x="663" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Copy</text>

    <!-- share buttons -->
    <rect x="444" y="448" width="80" height="44" rx="6" fill="#1d4ed8"/>
    <text x="484" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">WhatsApp</text>
    <rect x="530" y="448" width="80" height="44" rx="6" fill="#1d4ed8"/>
    <text x="570" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Facebook</text>
    <rect x="616" y="448" width="80" height="44" rx="6" fill="#1d4ed8"/>
    <text x="656" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Email</text>

    <text x="570" y="710" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">2 · The thank-you page</text>
  </g>
</svg>
