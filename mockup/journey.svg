<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="980" height="720" fill="#ffffff"/>
  <text x="490" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">How it works — the referral loop + reminders</text>

  <!-- ===== top row: the loop ===== -->
  <!-- box style helper via repetition -->
  <!-- 1 Pledge -->
  <rect x="40" y="80" width="180" height="92" rx="10" fill="#ecfdf5" stroke="#0b6e4f" stroke-width="2"/>
  <text x="130" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#0b6e4f">1 · Member pledges</text>
  <text x="130" y="128" text-anchor="middle" font-size="11" fill="#374151">on /pledge?ref=CODE</text>
  <text x="130" y="146" text-anchor="middle" font-size="11" fill="#374151">enters email · ?ref</text>
  <text x="130" y="162" text-anchor="middle" font-size="11" fill="#374151">saved as referred_by</text>

  <!-- 2 MailerLite double opt-in -->
  <rect x="270" y="80" width="180" height="92" rx="10" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">2 · MailerLite</text>
  <text x="360" y="128" text-anchor="middle" font-size="11" fill="#374151">double opt-in email</text>
  <text x="360" y="146" text-anchor="middle" font-size="11" fill="#374151">member clicks</text>
  <text x="360" y="162" text-anchor="middle" font-size="11" fill="#374151">"Confirm"</text>

  <!-- 3 Worker -->
  <rect x="500" y="80" width="200" height="92" rx="10" fill="#fef3c7" stroke="#b8860b" stroke-width="2"/>
  <text x="600" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5901">3 · Referral worker</text>
  <text x="600" y="126" text-anchor="middle" font-size="10.5" fill="#374151">webhook on confirm:</text>
  <text x="600" y="142" text-anchor="middle" font-size="10.5" fill="#374151">• mint their own code</text>
  <text x="600" y="158" text-anchor="middle" font-size="10.5" fill="#374151">• +1 to referrer's count</text>

  <!-- 4 Thank-you -->
  <rect x="750" y="80" width="190" height="92" rx="10" fill="#ecfdf5" stroke="#0b6e4f" stroke-width="2"/>
  <text x="845" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#0b6e4f">4 · Thank-you page</text>
  <text x="845" y="128" text-anchor="middle" font-size="10.5" fill="#374151">shows personal link +</text>
  <text x="845" y="144" text-anchor="middle" font-size="10.5" fill="#374151">"brought in N voters"</text>
  <text x="845" y="160" text-anchor="middle" font-size="10.5" fill="#374151">+ share buttons</text>

  <!-- arrows row -->
  <g stroke="#6b7280" stroke-width="2.5" fill="#6b7280">
    <line x1="220" y1="126" x2="262" y2="126"/><polygon points="262,120 274,126 262,132"/>
    <line x1="450" y1="126" x2="492" y2="126"/><polygon points="492,120 504,126 492,132"/>
    <line x1="700" y1="126" x2="742" y2="126"/><polygon points="742,120 754,126 742,132"/>
  </g>

  <!-- the loop: share link back to pledge -->
  <path d="M845 172 L845 250 L130 250 L130 176" fill="none" stroke="#0b6e4f" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="124,188 130,174 136,188" fill="#0b6e4f"/>
  <text x="490" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#0b6e4f">Supporter shares their link → a new member lands on /pledge?ref=CODE → the pyramid grows</text>

  <!-- data store note -->
  <rect x="500" y="290" width="200" height="58" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="600" y="312" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">State (no new PII store):</text>
  <text x="600" y="328" text-anchor="middle" font-size="10" fill="#374151">MailerLite custom fields +</text>
  <text x="600" y="342" text-anchor="middle" font-size="10" fill="#374151">KV index: code → subscriber id</text>
  <line x1="600" y1="172" x2="600" y2="288" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- ===== reminder timeline ===== -->
  <text x="490" y="408" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">5 · Reminder campaigns to the Pledgers group (Europe/London)</text>

  <line x1="70" y1="470" x2="910" y2="470" stroke="#d1d5db" stroke-width="4"/>

  <!-- ballot window markers -->
  <line x1="250" y1="448" x2="250" y2="600" stroke="#0b6e4f" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="250" y="618" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b6e4f">Ballots land 8 Jun</text>
  <line x1="850" y1="448" x2="850" y2="600" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="850" y="618" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">Voting closes 15 Jul (AGM)</text>

  <!-- 5 reminder dots -->
  <g font-size="10" fill="#374151" text-anchor="middle">
    <circle cx="190" cy="470" r="9" fill="#0b6e4f"/><text x="190" y="474" fill="#fff" font-size="9" font-weight="700">1</text>
    <text x="190" y="498">7 Jun</text><text x="190" y="512" font-weight="700">Ballot</text><text x="190" y="525" font-weight="700">tomorrow</text>

    <circle cx="290" cy="470" r="9" fill="#0b6e4f"/><text x="290" y="474" fill="#fff" font-size="9" font-weight="700">2</text>
    <text x="290" y="498">8 Jun</text><text x="290" y="512" font-weight="700">Ballot live</text><text x="290" y="525" font-weight="700">how-to-vote</text>

    <circle cx="520" cy="470" r="9" fill="#0b6e4f"/><text x="520" y="474" fill="#fff" font-size="9" font-weight="700">3</text>
    <text x="520" y="498">28 Jun</text><text x="520" y="512" font-weight="700">Have you</text><text x="520" y="525" font-weight="700">voted yet?</text>

    <circle cx="760" cy="470" r="9" fill="#0b6e4f"/><text x="760" y="474" fill="#fff" font-size="9" font-weight="700">4</text>
    <text x="760" y="498">11 Jul</text><text x="760" y="512" font-weight="700">Closes in</text><text x="760" y="525" font-weight="700">days</text>

    <circle cx="820" cy="470" r="9" fill="#b91c1c"/><text x="820" y="474" fill="#fff" font-size="9" font-weight="700">5</text>
    <text x="820" y="545">14 Jul</text><text x="820" y="558" font-weight="700">Final call</text>
  </g>

  <!-- footer line -->
  <text x="490" y="678" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5901">Every email + share carries: "Don't Quick Vote. Scroll down. Vote FOR Sherwin-Smith."</text>
  <text x="490" y="700" text-anchor="middle" font-size="10.5" fill="#6b7280">Double opt-in only · working unsubscribe · no member-register data · no individual vote tracking</text>
</svg>
