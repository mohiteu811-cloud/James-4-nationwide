<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#f3f4f6"/>

  <!-- header -->
  <rect x="0" y="0" width="1000" height="48" fill="#111827"/>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#ffffff">🛰️ Staffer console</text>
  <rect x="430" y="11" width="250" height="26" rx="5" fill="#ffffff"/>
  <text x="442" y="29" font-size="11" fill="#9ca3af">https://…workers.dev</text>
  <rect x="688" y="11" width="120" height="26" rx="5" fill="#ffffff"/>
  <text x="700" y="29" font-size="11" fill="#9ca3af">Staff token ••••</text>
  <rect x="816" y="11" width="90" height="26" rx="5" fill="#ffffff"/>
  <text x="828" y="29" font-size="11" fill="#9ca3af">Your name</text>
  <rect x="914" y="11" width="74" height="26" rx="5" fill="#0b6e4f"/>
  <text x="951" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Connect</text>

  <!-- guard banner -->
  <rect x="20" y="60" width="960" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="34" y="80" font-size="11.5" fill="#7a5901">Engage in <tspan font-weight="700">public</tspan> where you can. Public posts only — no profiling. "Did you vote?" logs only that you followed up. Re-work auto-stops after 2 tries.</text>

  <!-- tracker -->
  <rect x="20" y="102" width="960" height="78" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="36" y="126" font-size="14" font-weight="700" fill="#111827">📊 Tracker</text>
  <g font-size="12">
    <rect x="36" y="138" width="92" height="30" rx="6" fill="#f9fafb"/><text x="46" y="158" fill="#374151">Total <tspan font-size="15" font-weight="800" fill="#0b6e4f">128</tspan></text>
    <rect x="136" y="138" width="92" height="30" rx="6" fill="#f9fafb"/><text x="146" y="158" fill="#374151">New <tspan font-size="15" font-weight="800" fill="#0b6e4f">34</tspan></text>
    <rect x="236" y="138" width="104" height="30" rx="6" fill="#f9fafb"/><text x="246" y="158" fill="#374151">Assigned <tspan font-size="15" font-weight="800" fill="#0b6e4f">41</tspan></text>
    <rect x="348" y="138" width="112" height="30" rx="6" fill="#f9fafb"/><text x="358" y="158" fill="#374151">Converted <tspan font-size="15" font-weight="800" fill="#0b6e4f">37</tspan></text>
    <rect x="468" y="138" width="104" height="30" rx="6" fill="#f9fafb"/><text x="478" y="158" fill="#374151">Pledged <tspan font-size="15" font-weight="800" fill="#0b6e4f">31</tspan></text>
    <rect x="580" y="138" width="124" height="30" rx="6" fill="#f9fafb"/><text x="590" y="158" fill="#374151">Followed up <tspan font-size="15" font-weight="800" fill="#0b6e4f">26</tspan></text>
    <text x="720" y="158" font-size="11" fill="#6b7280">By staffer: Alex (12/15) · Sam (9/13) · Priya (16/13)</text>
  </g>

  <!-- left: add opportunity -->
  <rect x="20" y="194" width="468" height="486" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="36" y="220" font-size="14" font-weight="700" fill="#111827">➕ Add opportunity (from a public post)</text>

  <text x="36" y="250" font-size="11" fill="#374151">Topic / keyword</text>
  <rect x="36" y="256" width="436" height="32" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="48" y="277" font-size="12" fill="#111827">FairerShare</text>

  <text x="36" y="306" font-size="11" fill="#374151">Platform</text>
  <rect x="36" y="312" width="436" height="32" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="48" y="333" font-size="12" fill="#111827">X (Twitter)</text>

  <text x="36" y="362" font-size="11" fill="#374151">Public post URL</text>
  <rect x="36" y="368" width="436" height="32" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="48" y="389" font-size="12" fill="#111827">https://x.com/member/status/123…</text>

  <text x="36" y="418" font-size="11" fill="#374151">Priority</text>
  <rect x="36" y="424" width="436" height="32" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="48" y="445" font-size="12" fill="#111827">High ▾</text>

  <text x="36" y="474" font-size="11" fill="#374151">Note (public context only)</text>
  <rect x="36" y="480" width="436" height="50" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="48" y="500" font-size="12" fill="#111827">Asking how to vote FOR — reply with the</text>
  <text x="48" y="516" font-size="12" fill="#111827">how-to + their unique pledge link.</text>

  <rect x="36" y="546" width="150" height="36" rx="6" fill="#0b6e4f"/><text x="111" y="569" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Add to queue</text>
  <rect x="194" y="546" width="150" height="36" rx="6" fill="#1d4ed8"/><text x="269" y="569" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Claim next for me</text>
  <rect x="352" y="546" width="120" height="36" rx="6" fill="#374151"/><text x="412" y="569" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Round-robin all</text>

  <!-- right: queue -->
  <rect x="512" y="194" width="468" height="486" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="528" y="220" font-size="14" font-weight="700" fill="#111827">📋 Queue</text>
  <rect x="860" y="204" width="104" height="26" rx="5" fill="#fff" stroke="#d1d5db"/><text x="872" y="221" font-size="11" fill="#374151">All ▾</text>

  <!-- queue row 1: assigned -->
  <rect x="528" y="240" width="436" height="92" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <rect x="540" y="250" width="74" height="18" rx="9" fill="#fef3c7"/><text x="577" y="263" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">assigned</text>
  <text x="624" y="264" font-size="12.5" font-weight="700" fill="#111827">FairerShare</text>
  <text x="712" y="264" font-size="11" fill="#1d4ed8">post ↗</text>
  <text x="540" y="286" font-size="10.5" fill="#6b7280">P3 · X · 👤 Alex · re-work 0/2</text>
  <rect x="540" y="298" width="88" height="24" rx="5" fill="#1d4ed8"/><text x="584" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Contacted</text>
  <rect x="634" y="298" width="150" height="24" rx="5" fill="#0b6e4f"/><text x="709" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Converted → pledged</text>
  <rect x="790" y="298" width="64" height="24" rx="5" fill="#374151"/><text x="822" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Re-work</text>
  <rect x="860" y="298" width="44" height="24" rx="5" fill="#374151"/><text x="882" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Drop</text>

  <!-- queue row 2: contacted, follow-up -->
  <rect x="528" y="342" width="436" height="92" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <rect x="540" y="352" width="80" height="18" rx="9" fill="#e9d5ff"/><text x="580" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#6b21a8">contacted</text>
  <text x="630" y="366" font-size="12.5" font-weight="700" fill="#111827">AGM voting</text>
  <text x="540" y="388" font-size="10.5" fill="#6b7280">P2 · Facebook · 👤 Sam · re-work 1/2</text>
  <rect x="540" y="400" width="150" height="24" rx="5" fill="#0b6e4f"/><text x="615" y="416" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Converted → pledged</text>
  <rect x="696" y="400" width="156" height="24" rx="5" fill="#1d4ed8"/><text x="774" y="416" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">"Did you vote?" ✓</text>

  <!-- queue row 3: converted -->
  <rect x="528" y="444" width="436" height="78" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <rect x="540" y="454" width="82" height="18" rx="9" fill="#d1fae5"/><text x="581" y="467" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">converted</text>
  <text x="632" y="468" font-size="12.5" font-weight="700" fill="#111827">Quick Vote confusion</text>
  <text x="540" y="490" font-size="10.5" fill="#6b7280">P3 · X · 👤 Priya · → pledged · ✅ followed up · re-work 0/2</text>
  <text x="540" y="510" font-size="10.5" fill="#9ca3af">Replied in public with how-to-vote; sent their pledge link.</text>

  <!-- queue row 4: rework -->
  <rect x="528" y="532" width="436" height="62" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <rect x="540" y="542" width="66" height="18" rx="9" fill="#fed7aa"/><text x="573" y="555" text-anchor="middle" font-size="10" font-weight="700" fill="#9a3412">rework</text>
  <text x="616" y="556" font-size="12.5" font-weight="700" fill="#111827">No reply yet</text>
  <text x="540" y="580" font-size="10.5" fill="#6b7280">P1 · forum · unassigned · re-work 2/2 (next attempt auto-drops)</text>

  <text x="528" y="624" font-size="10.5" fill="#6b7280">Re-work cap and "no profiling" rules are enforced by the worker, not just the UI.</text>
  <text x="528" y="642" font-size="10.5" fill="#6b7280">Conversions flow into the same referral + leaderboard engine as organic pledges.</text>
</svg>
