name = 'james4nw'
main = "src/index.js"
compatibility_date = "2024-11-01"

# State lives in two Durable Objects (strongly consistent — atomic counts and an
# atomic outreach queue, so there are no lost-update or read-modify-write races).
# They hold no extra PII: opaque referral codes + counts, and references to
# PUBLIC posts only. (Build Brief §6 / docs/outreach-engine-design.md)
[[durable_objects.bindings]]
name = "REFERRAL_LEDGER"
class_name = "ReferralLedger"

[[durable_objects.bindings]]
name = "OUTREACH_QUEUE"
class_name = "OutreachQueue"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReferralLedger", "OutreachQueue"]

[vars]
# Public site origin. Used to build share links and to lock CORS on the public
# endpoints. Staff endpoints reflect the request origin (they are token-authed),
# so the staffer console can run from anywhere.
SITE_BASE_URL = "https://james4nationwide.co.uk"

# Optional but recommended: the MailerLite Pledgers group ID. When set, only
# confirmed members of that group are credited, so an account-level webhook
# can't turn a Weekly/Daily subscriber into a referral participant.
# PLEDGERS_GROUP_ID = "123456"

# Secrets (DO NOT put these here — set them with `wrangler secret put`):
#   MAILERLITE_API_TOKEN   MailerLite -> Integrations -> API (needs API access)
#   WEBHOOK_SECRET         shared token appended to the webhook URL (?token=...)
#   STAFF_TOKEN            shared token for the staffer console (X-Staff-Token)
